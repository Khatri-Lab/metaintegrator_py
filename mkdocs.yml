# MkDocs Configuration for MetaIntegrator Python (WITH COCONUT INTEGRATION)
# ========================================================================

# Project Information
site_name: MetaIntegrator Python
site_description: 'Modern meta-analysis and batch normalization for gene expression data'
site_author: 'P. Khatri Lab'
site_url: 'https://khatrilab.stanford.edu/tools/'  # Update when public

# Repository (optional - can comment out for internal)
# repo_name: 'metaintegrator/metaintegrator_py'
# repo_url: 'https://github.com/Khatri-Lab/metaintegrator_py'
# edit_uri: 'edit/main/docs/'

# Copyright
copyright: 'Copyright &copy; 2026 P. Khatri Lab'

# Theme Configuration
theme:
  name: material
  
  # Color Scheme
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Features
  features:
    - navigation.instant      # Instant loading
    - navigation.tracking     # URL tracking
    - navigation.tabs         # Top-level tabs
    - navigation.sections     # Section navigation
    - navigation.expand       # Expand navigation by default
    - navigation.top          # Back to top button
    - search.suggest          # Search suggestions
    - search.highlight        # Highlight search terms
    - search.share           # Share search results
    - content.code.copy      # Copy code button
    - content.tabs.link      # Link content tabs
  
  # Logo and Icon
  icon:
    logo: material/dna
    repo: fontawesome/brands/github
  
  # Favicon
  favicon: assets/favicon.png

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

