# Build the documentation on every relevant change. Publish it to GitHub
# Pages only when the repository variable DEPLOY_DOCS is set to "true".
#
# While the repository is private, leave DEPLOY_DOCS unset. The build still
# runs as a check (mkdocs --strict fails on broken links), and nothing is
# published.
#
# To publish later:
#   1. Settings, Pages, Build and deployment, Source: GitHub Actions.
#   2. Settings, Secrets and variables, Actions, Variables: add
#      DEPLOY_DOCS with the value "true".

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer pull request push replaces the older check. A run on main is
# never cancelled, so a deployment cannot be cut off halfway.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs and dependencies
        run: pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: ${{ vars.DEPLOY_DOCS == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    if: ${{ vars.DEPLOY_DOCS == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
