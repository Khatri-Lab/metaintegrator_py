# ==========================================================================
# MetaIntegrator-py — pyproject.toml
# ==========================================================================

[project]
name = "metaintegrator_py"
version = "0.1.0"
description = "Python implementation of MetaIntegrator for multi-cohort meta-analysis of gene expression data"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Khatri Lab", email = "khatrilab-support@stanford.edu"},
]
keywords = [
    "meta-analysis",
    "bioinformatics",
    "gene-expression",
    "genomics",
    "microarray",
    "GEO",
    "transcriptomics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scipy>=1.9.0",
    "scikit-learn>=0.24.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.2",
    "PyYAML>=6.0.3",
    "requests>=2.25.0",
    "lxml>=4.6.0",
    "tqdm>=4.60.0",
    "plotly>=5.0.0",
    "openpyxl>=3.0.0",
    "xlrd>=2.0.0",
    "GEOparse>=2.0.3",
    # Used by src/metaintegrator/scoring_export_engine.py and
    # src/metaintegrator/linc_tools.py (module-level `from jinja2 import
    # Template`) for HTML report generation. Previously undeclared here —
    # only listed in the now-retired tests/metaintegrator/
    # test_requirements_OBSOLETE.txt, which nothing actually installed.
    "jinja2>=3.0.0",
    # Required engine for pandas' DataFrame.to_parquet(), used by
    # src/metaintegrator/scoring_export_engine.py's ExportFormat.PARQUET
    # branch. pandas raises ImportError at call time (not import time)
    # without pyarrow or fastparquet installed — undeclared here, only
    # listed in the now-retired tests/metaintegrator/
    # test_requirements_OBSOLETE.txt.
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=5.0.0",
    "black>=22.0.0",
    "mypy>=0.991",
    "isort>=5.10.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "psutil>=5.7.0",
    # Required by tests/metaintegrator/test_enhanced_core_analysis.py's
    # `benchmark` fixture and by test_data_generators_with_enhanced_core_
    # analysis.py's `pytest_plugins = ["pytest_benchmark"]` declaration —
    # the latter makes this a hard collection-time dependency, not an
    # optional one: pytest fails to collect that whole module without it.
    "pytest-benchmark>=4.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/Khatri-Lab/metaintegrator_py"
Documentation = "https://khatri-lab.github.io/metaintegrator_py/"
Repository = "https://github.com/Khatri-Lab/metaintegrator_py"
Issues = "https://github.com/Khatri-Lab/metaintegrator_py/issues"

# --------------------------------------------------------------------------
# Build system
# --------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"metaintegrator" = ["data/**/*"]
"preprocessing" = ["data/**/*"]

# --------------------------------------------------------------------------
# Tool configuration
# --------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Python path configuration
pythonpath = ["src"]

# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output options
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--durations=10",
    "--color=yes",
    "--cov=src",
    "--cov-report=term-missing",
]

# Markers
# `performance` and `regression` are used (@pytest.mark.performance in
# tests/metaintegrator/test_scoring_statistical_analysis.py and
# tests/visualization/test_plotting.py; pytest.mark.regression referenced
# in tests/metaintegrator/test_data_generators_with_enhanced_core_analysis.py)
# but were never registered here, so --strict-markers failed collection of
# those modules the first time anything ran the full `tests/` tree.
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "parametric: tests using parametric priors",
    "nonparametric: tests using non-parametric priors",
    "performance: marks performance-sensitive tests",
    "regression: marks regression tests",
]

# Minimum version
minversion = "6.0"

# Warning filters
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:scipy.*",
    "ignore::RuntimeWarning:numpy.*",
]
